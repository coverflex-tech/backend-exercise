{
  server {
    host: "localhost"
    port: 4000
  }

  database {
    host: "localhost"
    port: 5432
    username: "coverflex"
    password: "coverflex"
    db: "coverflex"
  }

  ## Flyway
  flyway {
    connect-retries = 10
    locations = "db/migration"
    sql-migration-prefix = "V"
    repeatable-sql-migration-prefix = "R"
    sql-migration-separator = "__"
    sql-migration-suffixes = ".sql"
    encoding = "UTF-8"
    baseline-version = "1"
    baseline-on-migration = false
  }
}